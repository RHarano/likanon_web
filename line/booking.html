    <style>
        .bk-wrapper {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }
        .bk-hero {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
        }
        .bk-hero .badge {
            display: inline-block;
            padding: 0.3rem 0.9rem;
            background: #c9a96e;
            color: #fff;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .bk-hero h1 {
            font-size: 1.5rem;
            line-height: 1.55;
            margin: 0 0 0.75rem;
            color: #1a1a1a;
        }
        .bk-hero p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.8;
            margin: 0;
        }
        .bk-notes {
            background: #faf7f0;
            border-left: 4px solid #c9a96e;
            padding: 1rem 1.25rem;
            margin: 1.5rem 0 2rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.88rem;
            line-height: 1.85;
            color: #333;
        }
        .bk-notes strong {
            color: #8a6a3b;
        }
        .bk-form {
            background: #fff;
            padding: 2rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .bk-form .group {
            margin-bottom: 1.25rem;
        }
        .bk-form label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.4rem;
        }
        .bk-form .req {
            display: inline-block;
            margin-left: 0.4rem;
            padding: 0.1rem 0.4rem;
            background: #c9a96e;
            color: #fff;
            font-size: 0.68rem;
            border-radius: 4px;
            font-weight: 700;
            vertical-align: middle;
        }
        .bk-form .opt {
            display: inline-block;
            margin-left: 0.4rem;
            padding: 0.1rem 0.4rem;
            background: #e8e8e8;
            color: #666;
            font-size: 0.68rem;
            border-radius: 4px;
            font-weight: 700;
            vertical-align: middle;
        }
        .bk-form input,
        .bk-form select,
        .bk-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
        }
        .bk-form input:focus,
        .bk-form select:focus,
        .bk-form textarea:focus {
            outline: none;
            border-color: #c9a96e;
            box-shadow: 0 0 0 2px rgba(201,169,97,0.15);
        }
        .bk-form textarea {
            min-height: 100px;
            resize: vertical;
        }
        .bk-date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .bk-submit {
            display: block;
            width: 100%;
            padding: 1rem;
            background: #c9a96e;
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }
        .bk-submit:hover {
            background: #b8964e;
            transform: translateY(-1px);
        }
        .bk-note {
            text-align: center;
            font-size: 0.78rem;
            color: #888;
            margin-top: 1rem;
            line-height: 1.7;
        }
        .bk-alt {
            text-align: center;
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f7f7f7;
            border-radius: 12px;
        }
        .bk-alt p {
            margin: 0 0 0.75rem;
            font-size: 0.85rem;
            color: #666;
        }
        .bk-alt a {
            color: #06C755;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
        }

<body>
    <header class="header" id="header">
        <div class="header-inner">
            <a href="/" class="logo" aria-label="LIKaNON トップへ">
                <img src="/img/likanonlogo.png" alt="LIKaNON" class="logo-image">
            </a>
        </div>
    </header>

    <main class="bk-wrapper">
        <div class="bk-hero">
            <span class="badge">無料・30分</span>
            <h1>無料相談のご予約</h1>
            <p>オンラインまたはお電話で、30分のご相談を承ります</p>
        </div>

        <div class="bk-notes">
            <strong>※ ご相談内容について</strong><br>
            HP制作・SEO・Instagram運用・MEOなど、集客に関するご相談を幅広く承ります。<br>
            <strong>しつこい営業は一切ありません。</strong>相談のみで終了していただいて構いません。
        </div>

        <form class="bk-form" action="https://formsubmit.co/info@likanon.com" method="POST">
            <input type="hidden" name="_subject" value="【LIKaNON】無料相談予約">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="true">
            <input type="hidden" name="_next" value="https://likanon.com/thanks.html">
            <input type="hidden" name="_autoresponse" value="この度はLIKaNONの無料相談にお申し込みいただきありがとうございます。ご希望日時を確認の上、通常24時間以内に調整のご連絡をいたします。返信が届かない場合は、迷惑メールフォルダをご確認いただくか、LINE（https://lin.ee/43NTiCQ）よりご連絡ください。">
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

            <div class="group">
                <label for="name">お名前<span class="req">必須</span></label>
                <input type="text" id="name" name="お名前" required autocomplete="name" placeholder="例:山田 太郎">
            </div>

            <div class="group">
                <label for="email">メールアドレス<span class="req">必須</span></label>
                <input type="email" id="email" name="メールアドレス" required autocomplete="email" placeholder="example@mail.com">
            </div>

            <div class="group">
                <label for="tel">電話番号<span class="opt">任意</span></label>
                <input type="tel" id="tel" name="電話番号" autocomplete="tel" placeholder="090-0000-0000">
            </div>

            <div class="group">
                <label for="method">相談方法<span class="req">必須</span></label>
                <select id="method" name="相談方法" required>
                    <option value="">選択してください</option>
                    <option value="Zoom">Zoomオンライン(推奨)</option>
                    <option value="Google Meet">Google Meet</option>
                    <option value="電話">電話</option>
                    <option value="LINE通話">LINE通話</option>
                </select>
            </div>

            <div class="group">
                <label>第1希望日時<span class="req">必須</span></label>
                <div class="bk-date-grid">
                    <input type="date" name="第1希望_日付" required>
                    <select name="第1希望_時間帯" required>
                        <option value="">時間帯</option>
                        <option value="10:00-12:00">10:00-12:00</option>
                        <option value="13:00-15:00">13:00-15:00</option>
                        <option value="15:00-17:00">15:00-17:00</option>
                        <option value="17:00-19:00">17:00-19:00</option>
                        <option value="19:00-21:00">19:00-21:00</option>
                    </select>
                </div>
            </div>

            <div class="group">
                <label>第2希望日時<span class="opt">任意</span></label>
                <div class="bk-date-grid">
                    <input type="date" name="第2希望_日付">
                    <select name="第2希望_時間帯">
                        <option value="">時間帯</option>
                        <option value="10:00-12:00">10:00-12:00</option>
                        <option value="13:00-15:00">13:00-15:00</option>
                        <option value="15:00-17:00">15:00-17:00</option>
                        <option value="17:00-19:00">17:00-19:00</option>
                        <option value="19:00-21:00">19:00-21:00</option>
                    </select>
                </div>
            </div>

            <div class="group">
                <label>第3希望日時<span class="opt">任意</span></label>
                <div class="bk-date-grid">
                    <input type="date" name="第3希望_日付">
                    <select name="第3希望_時間帯">
                        <option value="">時間帯</option>
                        <option value="10:00-12:00">10:00-12:00</option>
                        <option value="13:00-15:00">13:00-15:00</option>
                        <option value="15:00-17:00">15:00-17:00</option>
                        <option value="17:00-19:00">17:00-19:00</option>
                        <option value="19:00-21:00">19:00-21:00</option>
                    </select>
                </div>
            </div>

            <div class="group">
                <label for="topic">相談したい内容<span class="req">必須</span></label>
                <select id="topic" name="相談内容_カテゴリ" required>
                    <option value="">選択してください</option>
                    <option value="集客全般">集客全般について</option>
                    <option value="HP新規制作">HP新規制作</option>
                    <option value="HPリニューアル">HPリニューアル・改善</option>
                    <option value="SEO対策">SEO対策</option>
                    <option value="Instagram運用">Instagram・SNS運用</option>
                    <option value="MEO・GA4">MEO・GA4計測</option>
                    <option value="セット運用">HP+Instagramセット運用</option>
                    <option value="その他">その他・未定</option>
                </select>
            </div>

            <div class="group">
                <label for="detail">相談の詳細<span class="opt">任意</span></label>
                <textarea id="detail" name="相談の詳細" placeholder="例:HPはあるのですが問い合わせが来ません。原因と改善策を知りたいです。"></textarea>
            </div>

            <button type="submit" class="bk-submit">無料相談を予約する</button>
            <p class="bk-note">予約確定の連絡は24時間以内にメールまたはLINEで差し上げます</p>
        </form>

        <div class="bk-alt">
            <p>フォーム入力が面倒な方へ</p>
            <a href="https://lin.ee/43NTiCQ" target="_blank" rel="noopener">LINEで直接相談する →</a>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 LIKaNON. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
