<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E69R3DCREZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-E69R3DCREZ');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="30秒でわかるHP集客診断。5つの質問に答えるだけで、あなたのHPに必要な次の一手がわかります。個人事業主・小規模店舗向けの無料セルフ診断ツール。">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1a1a1a">
    <title>30秒でわかるHP集客診断 | LIKaNON</title>
    <link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="icon" type="image/png" href="/img/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=20261028">
    <style>
        .diag-wrapper {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }
        .diag-hero {
            text-align: center;
            padding: 3rem 1rem 2rem;
        }
        .diag-hero .badge {
            display: inline-block;
            padding: 0.3rem 0.9rem;
            background: #c9a96e;
            color: #fff;
            border-radius: 999px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .diag-hero h1 {
            font-size: 1.6rem;
            line-height: 1.55;
            margin: 0 0 0.75rem;
            color: #1a1a1a;
        }
        .diag-hero p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.8;
            margin: 0;
        }
        .diag-progress {
            display: flex;
            gap: 0.4rem;
            margin: 1.5rem 0 2rem;
        }
        .diag-progress .dot {
            flex: 1;
            height: 6px;
            background: #e9e4d7;
            border-radius: 3px;
            transition: background 0.3s;
        }
        .diag-progress .dot.active {
            background: #c9a96e;
        }
        .diag-step {
            display: none;
            background: #fff;
            padding: 2rem 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .diag-step.active {
            display: block;
        }
        .diag-step h2 {
            font-size: 1.15rem;
            margin: 0 0 1.5rem;
            color: #1a1a1a;
            line-height: 1.6;
        }
        .diag-options {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .diag-option {
            display: block;
            padding: 1rem 1.2rem;
            background: #faf7f0;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #333;
            text-align: left;
            transition: all 0.2s;
            width: 100%;
            font-family: inherit;
        }
        .diag-option:hover {
            border-color: #c9a96e;
            background: #fff;
        }
        .diag-result {
            display: none;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            color: #fff;
            padding: 2.5rem 1.75rem;
            border-radius: 16px;
            text-align: center;
        }
        .diag-result.active {
            display: block;
        }
        .diag-result .rtype {
            display: inline-block;
            padding: 0.3rem 0.9rem;
            background: #c9a96e;
            color: #fff;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .diag-result h2 {
            font-size: 1.35rem;
            margin: 0 0 1rem;
            line-height: 1.5;
        }
        .diag-result p {
            color: #ddd;
            font-size: 0.95rem;
            line-height: 1.9;
            margin: 0 0 1.5rem;
        }
        .diag-ctas {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .diag-cta-primary {
            display: block;
            padding: 1rem;
            background: #c9a96e;
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .diag-cta-secondary {
            display: block;
            padding: 1rem;
            background: transparent;
            color: #c9a96e;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid #c9a96e;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .diag-restart {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            color: #888;
            font-size: 0.8rem;
            background: transparent;
            border: 1px solid #444;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <div class="header-inner">
            <a href="/" class="logo" aria-label="LIKaNON トップへ">
                <img src="/img/likanonlogo.png" alt="LIKaNON" class="logo-image">
            </a>
        </div>
    </header>

    <main class="diag-wrapper">
        <div class="diag-hero">
            <span class="badge">30秒で診断</span>
            <h1>あなたのHPに必要な<br>次の一手を診断します</h1>
            <p>5つの質問に答えるだけで、現状の課題と優先施策がわかります</p>
        </div>

        <div class="diag-progress" id="progress">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="diag-step active" data-step="1">
            <h2>Q1. 現在のHPの状況は?</h2>
            <div class="diag-options">
                <button class="diag-option" data-value="none">HPを持っていない</button>
                <button class="diag-option" data-value="old">3年以上更新していない</button>
                <button class="diag-option" data-value="exists">HPはあるが成果が不明</button>
                <button class="diag-option" data-value="active">定期的に更新している</button>
            </div>
        </div>

        <div class="diag-step" data-step="2">
            <h2>Q2. 月間の問い合わせ件数は?</h2>
            <div class="diag-options">
                <button class="diag-option" data-value="0">ほぼゼロ</button>
                <button class="diag-option" data-value="1-3">月1〜3件</button>
                <button class="diag-option" data-value="4-10">月4〜10件</button>
                <button class="diag-option" data-value="10plus">月10件以上</button>
            </div>
        </div>

        <div class="diag-step" data-step="3">
            <h2>Q3. 主な集客経路は?(一番近いもの)</h2>
            <div class="diag-options">
                <button class="diag-option" data-value="referral">紹介・リピーター中心</button>
                <button class="diag-option" data-value="sns">SNS(Instagram等)</button>
                <button class="diag-option" data-value="search">Google検索</button>
                <button class="diag-option" data-value="ad">Google広告・SNS広告</button>
                <button class="diag-option" data-value="unknown">どこからか不明</button>
            </div>
        </div>

        <div class="diag-step" data-step="4">
            <h2>Q4. 今、一番困っていることは?</h2>
            <div class="diag-options">
                <button class="diag-option" data-value="traffic">そもそもHPが見られていない</button>
                <button class="diag-option" data-value="inquiry">見られてるのに問い合わせがない</button>
                <button class="diag-option" data-value="design">デザインが古い・スマホで崩れる</button>
                <button class="diag-option" data-value="content">何を発信すればいいかわからない</button>
                <button class="diag-option" data-value="data">数字が見えず判断できない</button>
            </div>
        </div>

        <div class="diag-step" data-step="5">
            <h2>Q5. 改善を始めるタイミングは?</h2>
            <div class="diag-options">
                <button class="diag-option" data-value="now">今すぐ(1ヶ月以内)</button>
                <button class="diag-option" data-value="soon">3ヶ月以内</button>
                <button class="diag-option" data-value="later">半年以内</button>
                <button class="diag-option" data-value="info">情報収集中</button>
            </div>
        </div>

        <div class="diag-result" id="result">
            <span class="rtype" id="rtype">診断結果</span>
            <h2 id="rtitle"></h2>
            <p id="rbody"></p>
            <div class="diag-ctas">
                <a href="https://lin.ee/43NTiCQ" target="_blank" rel="noopener" class="diag-cta-primary">LINEで無料相談する</a>
                <a href="/#contact" class="diag-cta-secondary">お問い合わせフォームで送る</a>
            </div>
            <button class="diag-restart" onclick="restart()">もう一度診断する</button>
        </div>
    </main>

    <script>
        const answers = {};
        let currentStep = 1;

        document.querySelectorAll('.diag-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const step = e.target.closest('.diag-step').dataset.step;
                const value = e.target.dataset.value;
                answers['q' + step] = value;

                document.querySelector('[data-step="' + step + '"]').classList.remove('active');
                currentStep = parseInt(step) + 1;

                if (currentStep <= 5) {
                    document.querySelector('[data-step="' + currentStep + '"]').classList.add('active');
                    updateProgress(currentStep);
                } else {
                    showResult();
                }
            });
        });

        function updateProgress(step) {
            document.querySelectorAll('.diag-progress .dot').forEach((d, i) => {
                d.classList.toggle('active', i < step);
            });
        }

        function showResult() {
            document.getElementById('result').classList.add('active');
            document.querySelector('.diag-progress').style.display = 'none';
            const r = diagnose(answers);
            document.getElementById('rtype').textContent = r.type;
            document.getElementById('rtitle').textContent = r.title;
            document.getElementById('rbody').textContent = r.body;
            if (typeof gtag !== 'undefined') {
                gtag('event', 'diagnosis_complete', { 'result_type': r.type });
            }
        }

        function diagnose(a) {
            if (a.q1 === 'none') {
                return {
                    type: 'タイプA｜立ち上げ期',
                    title: 'まずはHP制作から。LPでも十分成果出ます',
                    body: '予算と目的から最適な形(本格HP/LP/テンプレ型)を一緒に判断します。業種別の集客導線設計もセットでご提案可能です。'
                };
            }
            if (a.q1 === 'old' || a.q4 === 'design') {
                return {
                    type: 'タイプB｜リニューアル期',
                    title: '放置HPのリニューアルが最優先です',
                    body: '3年以上更新していないHPは、SEO評価もCVRも落ちています。デザイン・SEO・導線を同時に改修する「全面リニューアル」が最速の改善策です。'
                };
            }
            if (a.q2 === '0' && (a.q4 === 'traffic' || a.q3 === 'unknown')) {
                return {
                    type: 'タイプC｜流入ゼロ型',
                    title: 'HP自体への流入を増やす施策が必要です',
                    body: 'SEO記事・ローカルSEO(MEO)・SNS連携のいずれかで、まずは見てもらえる状態を作ります。業種・地域に合わせた最適な集客経路を選定します。'
                };
            }
            if (a.q4 === 'inquiry') {
                return {
                    type: 'タイプD｜CVR改善型',
                    title: '表示はあるのに問い合わせがない状態です',
                    body: 'フォーム設計・CTAボタンの文言・信頼要素の追加で改善可能。実際に「表示あり/クリック0」の記事を強化してCVRが2-3倍になった事例があります。'
                };
            }
            if (a.q4 === 'content' || a.q3 === 'sns') {
                return {
                    type: 'タイプE｜HP×SNS連携型',
                    title: 'HPとInstagramのセット運用がおすすめです',
                    body: '発信軸・投稿テーマ・HP誘導の全体を設計し直すことで、SNS→HP→問い合わせの流れが機能します。認知と比較を一体化する伴走型プランがあります。'
                };
            }
            if (a.q4 === 'data') {
                return {
                    type: 'タイプF｜計測基盤型',
                    title: 'まず数字が見える状態を作りましょう',
                    body: 'GA4・Search Console・Instagramインサイトを統合した月次レポート体制を作ります。「次に何を直せば伸びるか」が明確になると改善サイクルが回り始めます。'
                };
            }
            return {
                type: 'タイプG｜複合課題型',
                title: '複数の課題が重なっているようです',
                body: '優先順位をつけて段階的に改善する必要があります。無料相談で現状を一緒に整理し、まず着手すべき1-2つの施策をご提案します。'
            };
        }

        function restart() {
            Object.keys(answers).forEach(k => delete answers[k]);
            currentStep = 1;
            document.getElementById('result').classList.remove('active');
            document.querySelector('.diag-progress').style.display = 'flex';
            document.querySelectorAll('.diag-step').forEach(s => s.classList.remove('active'));
            document.querySelector('[data-step="1"]').classList.add('active');
            updateProgress(1);
        }
    </script>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 LIKaNON. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
